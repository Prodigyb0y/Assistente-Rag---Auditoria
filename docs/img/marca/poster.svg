<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Gutenberg Systems · pôster</title>
  <desc id="d">Pôster com tipos móveis que se conectam num fluxo de automação, em vermelho tipográfico, sem retratos.</desc>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="#d9482b"/>
  <rect width="1200" height="750" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:multiply"/>
  <g transform="translate(0,110)">
  <!-- Título -->
  <text x="60" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="-2" fill="#f6efe6">Gutenberg</text>
  <text x="66" y="402" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="10" fill="#0b0b0b">SYSTEMS</text>
  <text x="66" y="450" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#0b0b0b">Automação e IA sobre dados fictícios</text>
