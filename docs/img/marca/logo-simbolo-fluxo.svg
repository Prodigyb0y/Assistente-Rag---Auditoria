<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 140" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Gutenberg Systems</title>
  <desc id="d">Marca fictícia: um G formado por um fluxo de nós, com uma faísca de IA no centro.</desc>
  <!-- Símbolo -->
  <rect x="4" y="4" width="132" height="132" rx="28" fill="#0b0b0b"/>
  <!-- G como um fluxo: trilha circular que termina em barra -->
  <path d="M84.5 39.4 A32 32 0 1 0 92 60 L66 60" fill="none" stroke="#f0efec" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Nós de automação -->
  <circle cx="84.5" cy="39.4" r="6" fill="#3b82f6"/>
  <circle cx="92" cy="60" r="6" fill="#3b82f6"/>
  <circle cx="66" cy="60" r="5" fill="#60a5fa"/>
  <circle cx="34" cy="48" r="3.5" fill="#60a5fa"/>
  <circle cx="44" cy="82" r="3.5" fill="#60a5fa"/>
  <!-- Faísca de IA -->
  <path d="M56 40 L58.2 46.2 L64.5 48.4 L58.2 50.6 L56 56.8 L53.8 50.6 L47.5 48.4 L53.8 46.2 Z" fill="#60a5fa"/>
  <!-- Texto -->
  <text x="158" y="78" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#0b0b0b" letter-spacing="-0.5">Gutenberg</text>
  <text x="160" y="104" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#52514e" letter-spacing="4">SYSTEMS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
